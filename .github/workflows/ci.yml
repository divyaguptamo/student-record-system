name: CI
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y
      - name: Build
        run: make all
      - name: Run tests
        run: make test
      - name: Static analysis (cppcheck)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          cppcheck --enable=warning,style,performance --inline-suppr -Iinclude src
      - name: Coverage (gcov)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          pip install gcovr
          mkdir -p cov
          SRC="$(ls src/*.c | grep -v 'src/main.c' | tr '\n' ' ') third_party/sha256/sha256.c"
          for t in tests/test_*.c; do
            n=$(basename "$t" .c)
            gcc --coverage -O0 -Iinclude -Ithird_party/unity -Ithird_party/sha256 -o "cov/$n" "$t" $SRC third_party/unity/unity.c
            "./cov/$n" > /dev/null
          done
          gcovr -r . --filter 'src/' --object-directory cov --print-summary